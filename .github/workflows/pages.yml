# Publishes site/ to GitHub Pages. The site is built locally with
# `node scripts/site.mjs` and committed, as the build reads installed versions
# from apps/*/node_modules, so there is no build step here.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v5
